<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKSH - Digital Assistant for Knowledge and Smart Handling</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #00ff00;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 25%;
            background: rgba(10, 14, 39, 0.9);
            border-right: 2px solid #00ff00;
            padding: 20px;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(10, 14, 39, 0.95);
            border-bottom: 2px solid #00ff00;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
        }

        .header h1 {
            font-size: 2em;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 0.9em;
            color: #00ff00;
            opacity: 0.7;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px 20px;
            background: rgba(20, 24, 49, 0.9);
            border-bottom: 1px solid #00ff00;
            font-size: 0.85em;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        .status-dot.active {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
        }

        .status-dot.inactive {
            background: #ff0000;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #00ff00;
            animation: slideIn 0.3s ease-out;
            font-size: 0.95em;
            line-height: 1.5;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .user-message {
            background: rgba(0, 100, 0, 0.2);
            margin-left: 40px;
            border-left-color: #00aa00;
        }

        .daksh-message {
            background: rgba(0, 50, 100, 0.2);
            margin-right: 40px;
            border-left-color: #00ffff;
            text-shadow: 0 0 5px #00ffff;
        }

        .input-area {
            padding: 20px;
            background: rgba(10, 14, 39, 0.95);
            border-top: 2px solid #00ff00;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background: rgba(20, 24, 49, 0.9);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border-radius: 3px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        input[type="text"]::placeholder {
            color: #00ff00;
            opacity: 0.5;
        }

        button {
            padding: 12px 20px;
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            color: #00ff00;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border-radius: 3px;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }

        button:hover {
            background: rgba(0, 255, 0, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .voice-btn {
            border-color: #ff0000;
            color: #ff0000;
        }

        .voice-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-title {
            font-size: 0.9em;
            margin-bottom: 10px;
            padding-bottom: 5px;
            border-bottom: 1px solid #00ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .sidebar-item {
            padding: 8px 0;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            padding-left: 10px;
            border-left: 2px solid transparent;
        }

        .sidebar-item:hover {
            border-left-color: #00ff00;
            padding-left: 15px;
            text-shadow: 0 0 5px #00ff00;
        }

        .stat-value {
            color: #00ffff;
            font-weight: bold;
        }

        .loading {
            display: inline-block;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        .scrollbar {
            scrollbar-width: thin;
            scrollbar-color: #00ff00 #1a1f3a;
        }

        .scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: #1a1f3a;
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar scrollbar">
            <div class="sidebar-section">
                <div class="sidebar-title">System Status</div>
                <div class="sidebar-item">
                    Status: <span class="stat-value" id="status">IDLE</span>
                </div>
                <div class="sidebar-item">
                    Voice: <span class="stat-value" id="voice-status">Ready</span>
                </div>
                <div class="sidebar-item">
                    Interactions: <span class="stat-value" id="interaction-count">0</span>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">LLM Router</div>
                <div class="sidebar-item">
                    Provider: <span class="stat-value" id="llm-provider">Auto</span>
                </div>
                <div class="sidebar-item">
                    Skills Used: <span class="stat-value" id="skills-used">--</span>
                </div>
                <div class="sidebar-item">
                    LLM Used: <span class="stat-value" id="llm-used">--</span>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">Recent Commands</div>
                <div id="command-history"></div>
            </div>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>⚡ DAKSH ⚡</h1>
                <p>Digital Assistant for Knowledge and Smart Handling</p>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot active"></div>
                    System Online
                </div>
                <div class="status-item">
                    <div class="status-dot active" id="voice-dot"></div>
                    Voice Recognition
                </div>
                <div class="status-item">
                    <div class="status-dot active" id="tts-dot"></div>
                    Text-to-Speech
                </div>
            </div>

            <div class="chat-area scrollbar" id="chatArea"></div>

            <div class="input-area">
                <div class="input-group">
                    <input type="text" id="userInput" placeholder="Speak or type your command..." autofocus>
                    <button id="sendBtn">Send</button>
                    <button class="voice-btn" id="voiceBtn">🎤 Voice</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');

        // Send message
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const input = userInput.value.trim();
            if (!input) return;

            // Display user message
            addMessage(input, 'user');
            userInput.value = '';

            // Send to DAKSH
            try {
                const response = await fetch('/api/daksh/interact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input, type: 'text' })
                });

                const data = await response.json();
                addMessage(data.response, 'daksh');
                updateStats();
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'daksh');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}-message`;
            div.textContent = sender === 'daksh' ? `DAKSH: ${text}` : `You: ${text}`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/daksh/status');
                const data = await response.json();
                document.getElementById('status').textContent = data.status.toUpperCase();
                document.getElementById('interaction-count').textContent = data.interactions;
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        // Voice button
        voiceBtn.addEventListener('click', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('Voice input not supported in this browser');
                return;
            }
            voiceBtn.textContent = '🎤 Listening...';
            // Voice recording logic would go here
            setTimeout(() => {
                voiceBtn.textContent = '🎤 Voice';
            }, 3000);
        });

        // Initialize
        updateStats();
        setInterval(updateStats, 5000);
        addMessage('DAKSH online. Ready to assist.', 'daksh');
    </script>
</body>
</html>
